<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voting Ketua Kelas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; }
        .candidate { transition: all 0.3s; }
        .candidate:hover { transform: scale(1.05); }
    </style>
</head>
<body class="bg-gray-50">
    <div class="max-w-2xl mx-auto p-6">
        <div class="text-center mb-8">
            <h1 class="text-4xl font-bold text-gray-800">🗳️ Voting Ketua Kelas</h1>
            <p class="text-gray-600 mt-2">Pilih calon terbaik untuk memimpin kelas kita!</p>
        </div>

        <div id="candidates" class="space-y-6"></div>

        <div class="mt-10 bg-white p-6 rounded-2xl shadow">
            <h2 class="text-xl font-semibold mb-4">📊 Hasil Real-time</h2>
            <div id="results" class="space-y-4"></div>
        </div>

        <div class="text-center mt-8">
            <button onclick="resetVotes()" class="bg-red-500 hover:bg-red-600 text-white px-6 py-3 rounded-xl text-sm font-medium">
                Reset Semua Vote (Admin)
            </button>
        </div>
    </div>

    <script>
        let votes = JSON.parse(localStorage.getItem('classVotes')) || {1: 0, 2: 0, 3: 0};
        const candidates = [
            {
                id: 1,
                name: "Andi Pratama",
                motto: "Inovasi dan Kebersamaan",
                photo: "https://picsum.photos/id/64/300/300"
            },
            {
                id: 2,
                name: "Budi Santoso",
                motto: "Discipline & Prestasi",
                photo: "https://picsum.photos/id/65/300/300"
            },
            {
                id: 3,
                name: "Citra Dewi",
                motto: "Kreatif & Peduli",
                photo: "https://picsum.photos/id/66/300/300"
            }
        ];

        function renderCandidates() {
            const container = document.getElementById('candidates');
            container.innerHTML = candidates.map(c => `
                <div class="candidate bg-white rounded-3xl shadow-md p-6 flex gap-6 items-center">
                    <img src="${c.photo}" class="w-24 h-24 rounded-2xl object-cover">
                    <div class="flex-1">
                        <h3 class="text-2xl font-bold">${c.name}</h3>
                        <p class="text-gray-600 mt-1">${c.motto}</p>
                        <button onclick="vote(${c.id})" 
                            class="mt-4 bg-blue-600 hover:bg-blue-700 text-white px-8 py-3 rounded-2xl font-medium w-full">
                            Pilih Saya 👆
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function vote(id) {
            if (localStorage.getItem('hasVoted')) {
                alert('Kamu sudah vote! Terima kasih.');
                return;
            }
            votes[id]++;
            localStorage.setItem('classVotes', JSON.stringify(votes));
            localStorage.setItem('hasVoted', 'true');
            renderResults();
            alert('Vote berhasil! Terima kasih telah berpartisipasi.');
        }

        function renderResults() {
            const total = Object.values(votes).reduce((a, b) => a + b, 0);
            const container = document.getElementById('results');
            container.innerHTML = candidates.map(c => {
                const count = votes[c.id] || 0;
                const percent = total > 0 ? Math.round((count / total) * 100) : 0;
                return `
                    <div>
                        <div class="flex justify-between mb-1">
                            <span class="font-medium">${c.name}</span>
                            <span class="font-mono">${count} suara (${percent}%)</span>
                        </div>
                        <div class="h-3 bg-gray-200 rounded-full overflow-hidden">
                            <div class="h-full bg-gradient-to-r from-blue-500 to-emerald-500" style="width: ${percent}%"></div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function resetVotes() {
            if (confirm('Reset semua vote?')) {
                votes = {1: 0, 2: 0, 3: 0};
                localStorage.removeItem('classVotes');
                localStorage.removeItem('hasVoted');
                renderResults();
            }
        }

        // Initialize
        renderCandidates();
        renderResults();
    </script>
</body>
</html>
